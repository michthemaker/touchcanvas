[package]
name = "touchcanvas"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.58", features = [
  # Core types — BOOL, HANDLE, HRESULT, etc.
  "Win32_Foundation",
  # GetModuleHandleW — needed to get the current exe's HMODULE for window creation
  "Win32_System_LibraryLoader",
  # Window class, message loop, WM_INPUT, WM_DESTROY, DefWindowProcW, etc.
  "Win32_UI_WindowsAndMessaging",
  # RAWINPUT, RAWINPUTHEADER, RAWHID, GetRawInputData, RIM_TYPEHID
  "Win32_UI_Input",
  # RAWINPUTDEVICE, RegisterRawInputDevices, RIDEV_INPUTSINK
  "Win32_UI_Input_KeyboardAndMouse",
  # HidP_GetCaps, HidP_GetData — kept for future HID report field parsing
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Graphics_Gdi",
] }
